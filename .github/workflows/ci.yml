name: VigilOps CI

on:
  push:
    branches: [main, develop, vigilops-upgrade]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vigilops
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: vigilops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vigilops -d vigilops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests && ruff check --config ruff.toml ../test-app
      - name: Run tests
        env:
          # Empty for the sqlite job (the suite then uses a temporary SQLite file).
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://vigilops:ci-test-password@localhost:5432/vigilops_test' || '' }}
        run: pytest
      - name: Demonstration application tests
        if: matrix.database == 'sqlite'   # the application has no database; once is enough
        run: pytest ../test-app/tests -q -p no:cacheprovider

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  configuration:
    name: Compose and monitoring configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          VIGILOPS_DOMAIN=vigilops.example.com docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v2.51.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager configuration
        run: |
          mkdir -p /tmp/secrets && echo "ci-token" > /tmp/secrets/alert_webhook_token
          docker run --rm --entrypoint amtool -v "$PWD/monitoring:/etc/alertmanager:ro" -v /tmp/secrets:/run/secrets:ro \
            prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

  hosted-image:
    name: Single-container image under free-tier limits
    runs-on: ubuntu-latest
    needs: [backend, configuration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the image used by render.yaml
        run: docker build -f deploy/render/Dockerfile -t vigilops-hosted:ci .
      - name: Start it with 512 MB and 0.1 CPU next to a PostgreSQL container
        run: |
          python scripts/generate_env.py            # bootstrap accounts and secrets for this run only
          POSTGRES_PASSWORD="$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)"
          docker network create hosted
          docker run -d --name pg --network hosted -e POSTGRES_USER=vigilops -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_DB=vigilops postgres:16-alpine
          # Secrets and bootstrap accounts come from the generated .env (the launcher
          # passes on only the variables each component needs); the -e values are the
          # settings of render.yaml and take precedence over the file.
          docker run -d --name hosted --network hosted --memory=512m --memory-swap=512m --cpus=0.1 \
            -p 127.0.0.1:10000:10000 --env-file .env \
            -e ENVIRONMENT=production -e DEMO_CONTROLS_ENABLED=true -e ALLOW_DEMO_CONTROLS_IN_PRODUCTION=true \
            -e DEMO_DISABLED_FAULTS=cpu,memory -e INTERNAL_ENDPOINTS_LOCAL_ONLY=true \
            -e MONITORING_HTTP_TIMEOUT_SECONDS=8 -e LOAD_INTERVAL_SECONDS=1 \
            -e DATABASE_URL="postgresql://vigilops:${POSTGRES_PASSWORD}@pg:5432/vigilops" \
            vigilops-hosted:ci
      - name: Wait until every component is running
        run: |
          for i in $(seq 1 100); do
            if docker logs hosted 2>&1 | grep -q "all components running"; then exit 0; fi
            if ! docker ps --format '{{.Names}}' | grep -qx hosted; then break; fi
            sleep 3
          done
          docker logs hosted; exit 1
      - name: Internal endpoints are not public; health is
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/health/live)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/metrics)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/health/ready)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/docs)" = 404
      - name: The demonstration store is public; its control and metrics paths are not
        run: |
          curl -s http://127.0.0.1:10000/orbitcrate/ | grep -q '<base href="/orbitcrate/">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/orbitcrate/static/app.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/orbitcrate/api/catalog)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/orbitcrate/internal/state)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/orbitcrate/metrics)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/orbitcrate/health/ready)" = 404
      - name: Run the three demonstrations against it
        run: python scripts/run_e2e_demos.py --base-url http://127.0.0.1:10000 --no-save
      - name: Memory in use and container log on failure
        if: always()
        run: |
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' hosted || true
          docker logs --tail=150 hosted || true

  stack:
    name: Full stack and end-to-end demonstrations
    runs-on: ubuntu-latest
    needs: [backend, frontend, configuration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start the stack
        run: |
          python scripts/generate_env.py
          docker compose up --build -d
      - name: Verify the stack
        run: |
          sleep 20
          sh scripts/verify_stack.sh
      - name: Run the three demonstrations against the running stack
        run: python scripts/run_e2e_demos.py --no-save
      - name: Run the failed-remediation demonstration (stops and starts the application container)
        run: python scripts/run_failed_remediation_demo.py --no-save
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
