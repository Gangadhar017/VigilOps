# Lint configuration for the VigilOps backend (run: ruff check app tests)
line-length = 160
target-version = "py311"

[lint]
select = ["E", "F", "W", "B"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in argument defaults is the framework's idiom
    "B904",  # HTTPException raised from a handled domain error intentionally hides the cause
    "E501",  # long lines are allowed for prompt text and test data
]

[lint.per-file-ignores]
"tests/*" = ["E402", "B017"]  # env vars are set before imports; broad raises are fine in tests
"alembic/versions/*" = ["E501", "W291"]
