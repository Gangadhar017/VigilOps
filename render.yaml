# VigilOps on Render's free plan (Blueprint)
#
# Creates one free web service and one free PostgreSQL database.  The web
# service runs deploy/render/Dockerfile: the API, the remediation worker, the
# demonstration application, Prometheus and Alertmanager in ONE container,
# because the free plan offers no background workers, private services or
# disks.  The React frontend is deployed separately (frontend/vercel.json).
#
# How to use it and what the free plan means (the service sleeps after 15 idle
# minutes; the free database expires 30 days after creation):
#   docs/deployment-render-vercel.md
#
# When the Blueprint is created, Render asks for the three values marked
# "sync: false".  They are never stored in this repository.
databases:
  - name: vigilops-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: vigilops
    user: vigilops

services:
  - type: web
    name: vigilops
    runtime: docker
    plan: free
    region: singapore          # must be the database's region (private connection)
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      # --- mode ---------------------------------------------------------
      - key: ENVIRONMENT
        value: production
      # A hosted demonstration: production safeguards on, Administrator-only
      # demo controls still available, resource-heavy faults switched off
      # (the instance has 0.1 CPU and 512 MB shared by every component).
      - key: DEMO_CONTROLS_ENABLED
        value: "true"
      - key: ALLOW_DEMO_CONTROLS_IN_PRODUCTION
        value: "true"
      - key: DEMO_DISABLED_FAULTS
        value: cpu,memory
      # The API port is the public port here, so /metrics and /health/ready
      # answer only the Prometheus process inside the container.
      - key: INTERNAL_ENDPOINTS_LOCAL_ONLY
        value: "true"
      - key: MONITORING_HTTP_TIMEOUT_SECONDS
        value: "8"
      # Synthetic load on the demonstration application: one request per second
      # (the Compose stack sends two) to leave more of the small CPU share to the API.
      - key: LOAD_INTERVAL_SECONDS
        value: "1"

      # --- database (private connection string of the database above) ----
      - key: DATABASE_URL
        fromDatabase:
          name: vigilops-db
          property: connectionString

      # --- secrets generated by Render (random 256-bit values) -----------
      - key: SECRET_KEY
        generateValue: true
      - key: ALERT_WEBHOOK_TOKEN
        generateValue: true
      - key: DEMO_APP_CONTROL_TOKEN
        generateValue: true
      - key: DEMO_APP_RECOVERY_TOKEN
        generateValue: true

      # --- accounts created on first start --------------------------------
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@vigilops.local
      - key: BOOTSTRAP_OPERATOR_EMAIL
        value: operator@vigilops.local
      # You type these when creating the Blueprint.  At least 10 characters with
      # upper-case, lower-case and a digit; the service refuses to start otherwise.
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_OPERATOR_PASSWORD
        sync: false

      # --- VigilAI --------------------------------------------------------
      # Your Google Gemini API key.  Without one VigilAI answers in documentation mode.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_DAILY_REQUEST_LIMIT
        value: "200"
