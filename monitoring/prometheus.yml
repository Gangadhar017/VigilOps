# VigilOps - Prometheus configuration (version controlled)
#
# Short intervals are used so that the local demonstration reacts quickly.
# For a long-running deployment 15s is a more typical value; remember to update
# PROMETHEUS_SCRAPE_INTERVAL_SECONDS in .env to match.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Monitored demonstration application
  - job_name: demo-app
    static_configs:
      - targets: ["test-app:8001"]
        labels:
          resource: demo-app

  # The VigilOps backend itself
  - job_name: vigilops-backend
    static_configs:
      - targets: ["backend:8000"]
        labels:
          resource: vigilops-backend

  # Monitoring components
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
